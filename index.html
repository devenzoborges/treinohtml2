<!DOCTYPE html>
<html lang="pt -BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    link
    <title>pesquisa culturama</title>
</head>
<body>
    <h1>Pesquisa Online</h1>
    <section>
        <form action="" method = "get">
         <fieldset>
            <legend>Dados pessoais:</legend>
                <!--    Dados pessoais-->
            <label for="userName">Nome:</label>
           <input type="text" name ="userName" required>
           <br>
         <label for="age">Idade:</label>
          <input type="number" name="age" min="12" max="100" required>

         <br>
          <label for="birthdate" >Data de nascimento </label>
          <input type="date" name="birthdate" >
           <br>
          <label for="userEmail"> Email</label>
            <input type="email" name="userEmail" required>
           <br>
            <label for="userPhone">Telefone</label>
            <input type="tel" name="userPhone" pattern="[0-9]{11}" placeholder="DDD + Número">

            <br>
             <label for="userImage">Uploud De foto</label>
         <input type="file" accept="image/*" name="userImage">
         </fieldset>

         <fieldset>
           Perfil:</legend>

           <p>Genêro</p>
            <input type="radio" name="userGender" value="Masculino" id="Masc">
            <label for="userGender">Masculino</label>

              <input type="radio" name="userGender" value="Feminino" id="Fem">
            <label for="userGender">Feminino</label>

            
              <input type="radio" name="userGender" value="notInformed" id="notInformed">
            <label for="userGender">Prefiro não informar</label>
           <br>
              
           <label for="maritalstatus">Estado civil:</label>
            <select name="maritalstatus">
            
                <option value="notInformed">Selecione...</option>
                <option value="casado"> Casado</option>
                 <option value="solteiro"> Solteiro</option>
                  <option value="divorciado"> Divorciado</option>
                   <option value="casado"> União estável</option>


            </select>
         <br>
            <label for="city">Estado:</label>
         <select name="estado" required>
            <option value="notInformed">Selecione...</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
    
        </select>

         </fieldset>


         <fieldset>
    <legend>Hábitos:</legend>
    <p>Redes Sociais:</p>

    <input type="checkbox" name="social" value="Facebook" id="facebook">
    <label for="facebook">Facebook</label>
    <br>

    <input type="checkbox" name="social" value="LinkedIn" id="linkedin">
    <label for="linkedin">LinkedIn</label>
    <br>

    <input type="checkbox" name="social" value="Instagram" id="instagram">
    <label for="instagram">Instagram</label>
    <br>

    <input type="checkbox" name="social" value="X" id="x">
    <label for="x">X</label>

    <br>
    <label for="musicStyles">Estilo de Musical:</label>
    <input list="stylesTypes" id="musicStyles" name="userMusicStyles"type="text">
    <datalist id="stylesTypes">
        <option value="Rock">Rock</option>
        <option value="Pop">Pop</option>
        <option value="Sertanejo">Sertanejo</option>
        <option value="Funk">Funk</option>
        <option value="Pagode">Pagode</option>
        <option value="Forró">Forró</option>
        <option value="MPB">MPB</option>
    </datalist>
    <br>
    <label for="favoritColor">Cor Favorita:</label>
    <input type="color" name="favoritColor" id="favoritColor">
</fieldset>
        

           <br>
           <button type="submit">Enviar</button>
           

        </form>
    </section>
</body>
</html>
